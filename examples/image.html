<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Web Component Example</title>
  <script type="module" src="./main.ts"></script>
</head>

<body>
  <h1>AI Image Input Component</h1>

  <form id="imageInputForm">
    <p>This page demonstrates the usage of the Image Input Web Component.</p>
    <input type="hidden" name="test" value="test">
    <ai-image-input name="image"></ai-image-input>
    <br>
    <input type="submit">
  </form>
  <div id="image-output"></div>
  <script>
    const form = document.getElementById('imageInputForm');
    form.addEventListener('submit', handleImageSubmit);

    function handleImageSubmit(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const image = formData.get('image');
      const container = document.getElementById('image-output');
      if (container) {
        container.innerHTML = ''; // Clear previous image
      }

      if (image && container) {
        const img = document.createElement('img');
        img.style.maxWidth = '400px';
        img.style.maxHeight = '400px';
        if (typeof image === 'string') {
          img.src = image;
        } else if (image instanceof File) {
          img.src = URL.createObjectURL(image);
        }
        container.appendChild(img);
      }
    }
  </script>

</body>

</html>
